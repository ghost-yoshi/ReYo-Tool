[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reyo"
version = "0.1.0"
description = "Transforme une fiche de TP en compte rendu DOCX structuré."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["compte rendu", "tp", "docx", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "python-docx>=1.1,<2.0",
    "Pillow>=10.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["reyo*"]

[tool.setuptools.package-data]
reyo = ["captures/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.vercel] 
entrypoint = "src.reyo.api.main:app
